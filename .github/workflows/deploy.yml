name: Deploy ZoneFlow Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upgrade npm and print runtime versions
        run: |
          npm install --global npm@11.21.1
          node --version
          npm --version
          python3 --version

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fastapi pydantic httpx

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run Python AZBO V2 backend tests
        run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -v

      - name: Run frontend unit, integration, and Pyodide equivalence tests
        run: npx tsx --test src/simulation/azboV2.test.ts src/simulation/engine.test.ts src/simulation/pyodideEquivalence.test.ts

      - name: Build frontend for GitHub Pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://rufluu1234.pythonanywhere.com/api/v1' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || '' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
